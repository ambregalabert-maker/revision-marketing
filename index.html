<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="theme-color" content="#F4F9FD" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1A2B" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Révision Marketing · Chapitre 1</title>
    <script>
      // Applique le thème choisi avant l'affichage, pour éviter un flash de couleur.
      try {
        var t = JSON.parse(localStorage.getItem('rm-theme') || '"systeme"');
        if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t === 'sombre' ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
