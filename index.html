<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Mark'Up : révise le chapitre 1 de Marketing (Le concept de marché) avec un chemin quotidien, des flashcards, des QCM et des exercices corrigés." />
    <meta name="theme-color" content="#F6F7FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1320" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Mark'Up · Révise le marketing</title>
    <script>
      // Applique le thème choisi avant l'affichage, pour éviter un flash de couleur.
      try {
        var t = JSON.parse(localStorage.getItem('rm-theme') || '"systeme"');
        if (t === 'clair' || t === 'sombre') document.documentElement.dataset.theme = t === 'sombre' ? 'dark' : 'light';
      } catch (e) {}
      // Et la couleur choisie dans « Personnaliser » (Pêche par défaut).
      try {
        var p = JSON.parse(localStorage.getItem('rm-progression') || 'null');
        document.documentElement.dataset.accent = (p && p.profil && p.profil.preferences && p.profil.preferences.couleur) || 'peche';
      } catch (e) {
        document.documentElement.dataset.accent = 'peche';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
